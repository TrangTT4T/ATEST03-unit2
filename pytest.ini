[pytest]
testpaths = tests
pythonpath = . tests
# Day 6: tracing, screenshots and video are kept only for failed tests; HTML, JUnit and the
# traceability matrix (tests/traceability_plugin.py) are written on every run.
addopts =
    --strict-markers
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output test-results
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
    -m "not auth and not data_creating and not manual"
base_url = https://sauce-demo.myshopify.com
# --strict-markers: a marker that is not listed here (or in dataset/requirements.json, registered by
# the traceability plugin) is an error, so a typo such as @pytest.mark.add_to_card cannot slip through.
markers =
    smoke: minimum flow, run on every deploy
    regression: full automated suite, run nightly
    critical: risk level Critical (score >= 15)
    high: risk level High (10-14)
    medium: risk level Medium (6-9)
    negative: negative case
    network: uses network interception or throttling
    auth: needs a real customer account (SAUCE_EMAIL / SAUCE_PASSWORD)
    manual: run by hand only (e.g. the public store's CAPTCHA stops the form)
    data_creating: creates real data on the shared store - only with trainer approval
    allow_third_party: do not block third-party requests for this test
