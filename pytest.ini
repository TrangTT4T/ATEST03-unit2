[pytest]
testpaths = tests
pythonpath = . tests
# Day 6: tracing, screenshots and video are kept only for failed tests; HTML, JUnit and Allure results every run.
addopts =
    --strict-markers
    -rfEs
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output test-results
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
    --alluredir=reports/allure-results
    -m "not auth and not data_creating and not manual"
# BasePage logs every click and typed value (passwords as ***): shown in the report of a failed test.
log_level = INFO
base_url = https://sauce-demo.myshopify.com
# --strict-markers: a marker that is not listed here is an error, so a typo such as
# @pytest.mark.add_to_card cannot slip through. Requirement markers = the Unit 1 requirements REQ-01 ... REQ-08.
markers =
    smoke: minimum flow, run on every deploy
    regression: full automated suite, run nightly
    critical: risk level Critical (score >= 15)
    high: risk level High (10-14)
    medium: risk level Medium (6-9)
    negative: negative case
    api: calls the store's JSON API (tests/test_api.py); most of them open no browser
    auth: needs a real customer account (SAUCE_EMAIL / SAUCE_PASSWORD)
    manual: run by hand only (e.g. the public store's CAPTCHA stops the form)
    data_creating: creates real data on the shared store - only with trainer approval
    allow_third_party: do not block third-party requests for this test
    add_to_cart: requirement REQ-01 - Add products to the cart
    update_cart: requirement REQ-02 - Edit or remove products in the cart
    start_checkout: requirement REQ-03 - Proceed to checkout
    product_details: requirement REQ-04 - Correct product information
    secure_login: requirement REQ-05 - Log in securely
    browse_catalog: requirement REQ-06 - Browse the product list
    create_account: requirement REQ-07 - Create an account
    search_products: requirement REQ-08 - Search products by keyword
