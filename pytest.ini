[pytest]
testpaths = tests
pythonpath = . tests
# Day 6: tracing, screenshots and video are kept only for failed tests; HTML, JUnit and Allure results every run.
addopts =
    --strict-markers
    -rfEs
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output test-results
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
    --alluredir=reports/allure-results
# BasePage logs every click and typed value (passwords as ***): shown in the report of a failed test.
log_level = INFO
# Swag Labs: a demo shop made for test automation (no bot protection, no rate limit)
base_url = https://www.saucedemo.com
# --strict-markers: a marker that is not listed here is an error, so a typo such as
# @pytest.mark.add_to_card cannot slip through. Requirement markers = REQ-01 ... REQ-06 (README).
markers =
    smoke: minimum flow, run on every deploy
    regression: full automated suite, run nightly
    critical: risk level Critical (score >= 15)
    high: risk level High (10-14)
    medium: risk level Medium (6-9)
    negative: negative case
    add_to_cart: requirement REQ-01 - Add products to the cart
    update_cart: requirement REQ-02 - Remove products from the cart
    checkout: requirement REQ-03 - Check out: information, overview totals, order complete
    product_details: requirement REQ-04 - Correct product information
    secure_login: requirement REQ-05 - Log in and out securely
    browse_catalog: requirement REQ-06 - Browse and sort the product list
