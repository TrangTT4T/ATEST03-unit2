# Unit 2 Playwright suite (pytest + pytest-bdd) against https://sauce-demo.myshopify.com
#
#   push / pull request   @smoke on Chromium
#   nightly               the default suite (21 BDD scenarios + 4 network tests) on Chromium
#   Run workflow (manual) choose the markers, the browser, workers, tracing, and the login tests
name: e2e

on:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * *"   # nightly, 02:41 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run (a pytest marker; all = the default suite)
        type: choice
        options: [all, smoke, regression, critical, high, medium, negative, network, cart, checkout, login, product, register, search]
        default: all
      browser:
        description: Browser
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      workers:
        description: Parallel workers (pytest-xdist)
        type: choice
        options: ["1", "2", "4", auto]
        default: "2"
      tracing:
        description: Playwright tracing
        type: choice
        options: [retain-on-failure, "on", "off"]
        default: retain-on-failure
      auth:
        description: Also run the saved-login tests (needs the SAUCE_EMAIL and SAUCE_PASSWORD secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: pytest (${{ inputs.suite || (github.event_name == 'schedule' && 'all' || 'smoke') }}, ${{ inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Inputs reach the shell through the environment, never by ${{ }} inside a script.
      SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'all' || 'smoke') }}
      BROWSER: ${{ inputs.browser || 'chromium' }}
      WORKERS: ${{ inputs.workers || '2' }}
      TRACING: ${{ inputs.tracing || 'retain-on-failure' }}
      AUTH: ${{ inputs.auth || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps "$BROWSER"
      - name: Run the tests
        run: |
          base="not auth and not data-creating and not manual and not wip"
          if [ "$SUITE" = all ]; then marks="$base"; else marks="$SUITE and $base"; fi
          echo "Markers: ${marks} | browser: ${BROWSER} | workers: ${WORKERS} | tracing: ${TRACING}"
          pytest -m "$marks" --browser "$BROWSER" --tracing "$TRACING" -n "$WORKERS"
      - name: Saved-login tests
        if: ${{ !cancelled() && env.AUTH == 'true' }}
        env:
          SAUCE_EMAIL: ${{ secrets.SAUCE_EMAIL }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: |
          if [ -z "$SAUCE_EMAIL" ] || [ -z "$SAUCE_PASSWORD" ]; then
            echo "::error::Add the SAUCE_EMAIL and SAUCE_PASSWORD repository secrets to run the login tests."
            exit 1
          fi
          pytest -m auth --browser "$BROWSER" --junitxml=reports/junit-auth.xml --html=reports/report-auth.html
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os
          import xml.etree.ElementTree as ET
          print(f"### pytest: suite {os.environ['SUITE']}, browser {os.environ['BROWSER']}")
          print("| Report | Tests | Failures | Errors | Skipped |\n| --- | --- | --- | --- | --- |")
          for path in sorted(glob.glob("reports/junit*.xml")):
              root = ET.parse(path).getroot()
              s = root if root.tag == "testsuite" else root.find("testsuite")
              print(f"| {os.path.basename(path)} | {s.get('tests')} | {s.get('failures')} | {s.get('errors')} | {s.get('skipped')} |")
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-reports-${{ env.BROWSER }}
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
